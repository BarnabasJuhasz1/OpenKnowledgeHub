[project]
name = "openknowledge-contracts"
version = "0.1.0"
description = "Data contracts shared by the OpenKnowledge packages."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
