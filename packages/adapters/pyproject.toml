[project]
name = "openknowledge-adapters"
version = "0.1.0"
description = "Clients for the services OpenKnowledge reads from and writes to."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "google-cloud-storage>=3,<4",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
