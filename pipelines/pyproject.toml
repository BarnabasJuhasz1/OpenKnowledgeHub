[project]
name = "openknowledge-pipelines"
version = "0.1.0"
description = "Prefect flows and the okp command line."
requires-python = ">=3.12"
dependencies = [
    # Same version as the server in OpenKnowledgeInfra deploy/control/compose.yaml.
    "prefect==3.8.8",
    "click>=8,<9",
    "openknowledge-adapters",
]

[project.scripts]
okp = "openknowledge_pipelines.cli:main"

[tool.uv.sources]
openknowledge-adapters = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
