# Workspace root: no code of its own, only the members and the shared tool settings.
[tool.uv.workspace]
members = ["packages/adapters", "pipelines"]

[tool.uv.sources]
openknowledge-pipelines = { workspace = true }

[dependency-groups]
dev = [
    "openknowledge-pipelines",
    "pytest>=9,<10",
    "ruff>=0.17,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "packages/adapters/src", "pipelines/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D"]
# A docstring is written where it says something the code does not, so none is required.
ignore = ["D1"]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
